<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hausmeister{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2e5339">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/static/icons/icon-192.png" alt="" class="brand-icon">Hausmeister</a>
  <nav>
    <a href="/" {% if page == 'dashboard' %}class="active"{% endif %}>Übersicht</a>
    <a href="/jahresplan" {% if page == 'jahresplan' %}class="active"{% endif %}>Jahresplan</a>
    <a href="/tasks" {% if page == 'tasks' %}class="active"{% endif %}>Aufgaben</a>
    <a href="/history" {% if page == 'history' %}class="active"{% endif %}>Verlauf</a>
    <a href="/settings" {% if page == 'settings' %}class="active"{% endif %}>Einstellungen</a>
    <a href="/help/certificate" {% if page == 'help' %}class="active"{% endif %}>Hilfe</a>
  </nav>
</header>
<main>
  {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer>
  <span>Hausmeister – lokale Wartungsplanung</span>
  <span><a href="/help/certificate">Zertifikat einrichten</a></span>
</footer>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
