{% extends "base.html" %}
{% block title %}{{ "Aufgabe bearbeiten" if task else "Neue Aufgabe" }} – Hausmeister{% endblock %}
{% block content %}
<h1>{{ "Aufgabe bearbeiten" if task else "Neue Aufgabe" }}</h1>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}

<form method="post" class="card form" action="{{ '/tasks/' ~ task.id ~ '/edit' if task else '/tasks/new' }}">
  <label>Titel *
    <input type="text" name="title" required maxlength="300" value="{{ task.title if task else '' }}">
  </label>

  <label>Beschreibung
    <textarea name="description" rows="3">{{ task.description if task else '' }}</textarea>
  </label>

  <div class="grid2">
    <label>Bereich
      <select name="area">
        <option value="">—</option>
        {% for a in areas %}
        <option value="{{ a.slug }}" {% if task and task.area == a.slug %}selected{% endif %}>{{ a.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Kategorie
      <input type="text" name="category" list="category-list" placeholder="z. B. heizung" value="{{ task.category if task else '' }}">
      <datalist id="category-list">
        {% for c in categories %}<option value="{{ c.slug }}">{{ c.name }}</option>{% endfor %}
      </datalist>
    </label>
  </div>

  <div class="grid2">
    <label>Priorität
      <select name="priority">
        <option value="high" {% if task and task.priority == 'high' %}selected{% endif %}>Hoch</option>
        <option value="normal" {% if not task or task.priority == 'normal' %}selected{% endif %}>Normal</option>
        <option value="low" {% if task and task.priority == 'low' %}selected{% endif %}>Niedrig</option>
      </select>
    </label>
    <label>Geschätzte Dauer (Minuten)
      <input type="number" name="estimated_minutes" min="0" value="{{ task.estimated_minutes if task and task.estimated_minutes else '' }}">
    </label>
  </div>

  <label>Zeitplan-Typ
    <select name="schedule_type" id="schedule-type">
      <option value="one_time" {% if task and task.schedule_type == 'one_time' %}selected{% endif %}>Einmalig (festes Datum)</option>
      <option value="interval_days" {% if task and task.schedule_type == 'interval_days' %}selected{% endif %}>Tages-Intervall</option>
      <option value="annual_window" {% if task and task.schedule_type == 'annual_window' %}selected{% endif %}>Jährlich, Fenster</option>
      <option value="annual_repeat" {% if task and task.schedule_type == 'annual_repeat' %}selected{% endif %}>Jährlich, feste Monate</option>
    </select>
  </label>

  <div class="schedule-field" data-show="one_time">
    <label>Fälligkeitsdatum
      <input type="date" name="due_date" value="{{ task.due_date if task and task.due_date else '' }}">
    </label>
  </div>

  <div class="grid2 schedule-field" data-show="interval_days">
    <label>Intervall (Tage)
      <input type="number" name="interval_days" min="1" value="{{ task.interval_days if task and task.interval_days else '' }}">
    </label>
    <label>Erste Fälligkeit / Anker
      <input type="date" name="start_date" value="{{ task.start_date if task and task.start_date else '' }}">
    </label>
  </div>

  <div class="grid2 schedule-field" data-show="annual_window">
    <label>Fenster von (Monat 1–12)
      <input type="number" name="window_start_month" min="1" max="12" value="{{ task.window_start_month if task and task.window_start_month else '' }}">
    </label>
    <label>Fenster bis (Monat 1–12)
      <input type="number" name="window_end_month" min="1" max="12" value="{{ task.window_end_month if task and task.window_end_month else '' }}">
    </label>
  </div>

  <div class="grid2 schedule-field" data-show="annual_repeat">
    <label>Monate (1–12, getrennt durch ;)
      <input type="text" name="repeat_months" placeholder="3;6;9;12" value="{{ task.repeat_months|join(';') if task and task.repeat_months else '' }}">
    </label>
    <label>Tag im Monat
      <input type="number" name="repeat_day" min="1" max="31" value="{{ task.repeat_day if task else 1 }}">
    </label>
  </div>

  <div class="form-actions">
    <button class="btn primary" type="submit">Speichern</button>
    <a class="btn" href="/tasks">Abbrechen</a>
  </div>
</form>
{% endblock %}
